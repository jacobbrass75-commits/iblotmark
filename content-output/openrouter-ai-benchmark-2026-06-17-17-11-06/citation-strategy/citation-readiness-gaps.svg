<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="450" viewBox="0 0 1160 450" role="img">
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:1}.title{font:700 24px Arial,sans-serif;fill:#111827}.subtitle{font:400 14px Arial,sans-serif;fill:#64748b}.label{font:700 13px Arial,sans-serif;fill:#111827}.small{font:400 12px Arial,sans-serif;fill:#475569}.value{font:700 13px Arial,sans-serif;fill:#0f172a}.white{font:700 13px Arial,sans-serif;fill:#fff}
  </style>
  <rect class="bg" width="1160" height="450"/>
  
    <rect class="panel" x="28" y="24" width="1104" height="402" rx="14"/>
    <text class="title" x="54" y="64">Citation Readiness Gaps On Live Blog Pages</text>
    <text class="subtitle" x="54" y="88">The largest technical/content gaps that make pages less quotable by AI search systems.</text>
    
      <text class="label" x="54" y="122">Missing FAQ schema</text>
      <rect x="420" y="108" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="108" width="520" height="24" rx="8" fill="#dc2626"/>
      <text class="value" x="1028" y="125">99 pages</text>
      <text class="small" x="420" y="150"></text>
    

      <text class="label" x="54" y="170">Missing quick answer</text>
      <rect x="420" y="156" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="156" width="594" height="24" rx="8" fill="#dc2626"/>
      <text class="value" x="1028" y="173">113 pages</text>
      <text class="small" x="420" y="198"></text>
    

      <text class="label" x="54" y="218">Missing comparison signals</text>
      <rect x="420" y="204" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="204" width="289" height="24" rx="8" fill="#dc2626"/>
      <text class="value" x="1028" y="221">55 pages</text>
      <text class="small" x="420" y="246"></text>
    

      <text class="label" x="54" y="266">Failed public/local audit fetch</text>
      <rect x="420" y="252" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="252" width="0" height="24" rx="8" fill="#dc2626"/>
      <text class="value" x="1028" y="269">0 pages</text>
      <text class="small" x="420" y="294"></text>
    

      <text class="label" x="54" y="314">Missing Article schema</text>
      <rect x="420" y="300" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="300" width="100" height="24" rx="8" fill="#dc2626"/>
      <text class="value" x="1028" y="317">19 pages</text>
      <text class="small" x="420" y="342"></text>
    

      <text class="label" x="54" y="362">Possible duplicate/cannibalized pairs</text>
      <rect x="420" y="348" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="348" width="95" height="24" rx="8" fill="#dc2626"/>
      <text class="value" x="1028" y="365">18 pairs</text>
      <text class="small" x="420" y="390"></text>
    
  
</svg>