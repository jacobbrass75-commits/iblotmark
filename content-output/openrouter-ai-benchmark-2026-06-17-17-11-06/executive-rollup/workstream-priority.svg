<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="438" viewBox="0 0 1160 438" role="img">
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:1}.title{font:700 24px Arial,sans-serif;fill:#111827}.subtitle{font:400 14px Arial,sans-serif;fill:#64748b}.label{font:700 13px Arial,sans-serif;fill:#111827}.small{font:400 12px Arial,sans-serif;fill:#475569}.value{font:700 13px Arial,sans-serif;fill:#0f172a}.white{font:700 13px Arial,sans-serif;fill:#fff}
  </style>
  <rect class="bg" width="1160" height="438"/>
  
    <rect class="panel" x="28" y="24" width="1104" height="390" rx="14"/>
    <text class="title" x="54" y="64">Priority Workstreams</text>
    <text class="subtitle" x="54" y="88">Score is inverse priority, only for visual ordering.</text>
    
      <text class="label" x="54" y="122">Refresh high-intent pages for AI answers</text>
      <rect x="420" y="108" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="108" width="582" height="24" rx="8" fill="#7c3aed"/>
      <text class="value" x="1028" y="125">P1</text>
      <text class="small" x="420" y="149">8 top query gaps, led by best tablet mount; best multi tablet mount; best heavy duty vehicle phone mount</text>
    

      <text class="label" x="54" y="168">Build competitor displacement sections</text>
      <rect x="420" y="154" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="154" width="511" height="24" rx="8" fill="#7c3aed"/>
      <text class="value" x="1028" y="171">P2</text>
      <text class="small" x="420" y="195">RAM Mounts appears without iBOLT 53 times; top six competitors account for 126 competitor-only answer appearances.</text>
    

      <text class="label" x="54" y="214">Fix schema and citation structure at scale</text>
      <rect x="420" y="200" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="200" width="440" height="24" rx="8" fill="#7c3aed"/>
      <text class="value" x="1028" y="217">P3</text>
      <text class="small" x="420" y="241">99/142 audited pages missing FAQ schema; 113 missing quick answers; 55 missing comparison signals.</text>
    

      <text class="label" x="54" y="260">Clean blog inventory and product spread</text>
      <rect x="420" y="246" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="246" width="368" height="24" rx="8" fill="#7c3aed"/>
      <text class="value" x="1028" y="263">P4</text>
      <text class="small" x="420" y="287">187/343 catalog products are not linked from detected blog content; 55 posts have zero DB-tracked product rows.</text>
    

      <text class="label" x="54" y="306">Resolve matching, duplicate, and vertical</text>
<text class="small" x="54" y="321">mapping issues</text>
      <rect x="420" y="292" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="292" width="297" height="24" rx="8" fill="#7c3aed"/>
      <text class="value" x="1028" y="309">P5</text>
      <text class="small" x="420" y="333">17 local posts did not match public audit cleanly; 18 possible duplicate/cannibalized pairs; 1 duplicate local slug.</text>
    

      <text class="label" x="54" y="352">Run expanded benchmark once credentials are</text>
<text class="small" x="54" y="367">available</text>
      <rect x="420" y="338" width="594" height="24" rx="8" fill="#e2e8f0"/>
      <rect x="420" y="338" width="226" height="24" rx="8" fill="#7c3aed"/>
      <text class="value" x="1028" y="355">P6</text>
      <text class="small" x="420" y="379">Expanded benchmark backlog already contains 207 one-at-a-time prompts, but no benchmark key is available in the current process.</text>
    
  
</svg>